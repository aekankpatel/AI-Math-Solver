name: Deploy backend to Hugging Face Space

# Manual only: run it from the Actions tab once the Space and the secrets exist.
# Required repository settings (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  - Hugging Face access token with write access to the Space
#   variable HF_SPACE  - the Space id, e.g. <hf-username>/mathforge-api
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Repository secret HF_TOKEN is not set"; exit 1; }
          echo "$HF_SPACE" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
            || { echo "::error::Repository variable HF_SPACE must look like <user>/<space>"; exit 1; }

      - name: Assemble the Space bundle
        run: ./scripts/build_space_bundle.sh "$RUNNER_TEMP/space"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        working-directory: ${{ runner.temp }}/space
        run: |
          git init -q -b main
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${COMMIT::7} from GitHub"
          # The token is passed through an HTTP header, never written into a URL or file.
          auth=$(printf 'user:%s' "$HF_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraHeader="Authorization: Basic $auth" \
            push --force "https://huggingface.co/spaces/${HF_SPACE}" main
