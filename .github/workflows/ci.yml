name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Test (offline, no LLM key)
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/api/solve -H 'Content-Type: application/json' \
            -d '{"problem":"Solve x^2 - 5x + 6 = 0"}' | tee /tmp/out.json
          grep -q '"status":"verified"' /tmp/out.json
          curl -sf http://localhost:8080/ | grep -q MathForge
          curl -sf http://localhost:8080/api/health
      - if: always()
        run: docker compose down
