name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests eval
          ruff format --check app tests eval
      - name: Test (offline, no LLM key)
        run: pytest -v
      - name: Benchmark (deterministic modes, no network)
        run: |
          python -m eval.ground_truth
          python -m eval.run --mode oracle
          python -m eval.run --mode rules
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: backend/eval/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/api/solve -H 'Content-Type: application/json' \
            -d '{"problem":"Solve x^2 - 5x + 6 = 0"}' | tee /tmp/out.json
          grep -q '"status":"verified"' /tmp/out.json
          curl -sf http://localhost:8080/ | grep -q MathForge
          curl -sf http://localhost:8080/api/health
          # sandbox: a runaway computation is stopped and the server keeps answering
          curl -sf -X POST http://localhost:8080/api/solve -H 'Content-Type: application/json' \
            -d '{"problem":"expand (x+y+z+w+1)^200"}' | tee /tmp/slow.json
          grep -q '"error_code":"timeout"' /tmp/slow.json
          curl -sf -X POST http://localhost:8080/api/solve -H 'Content-Type: application/json' \
            -d '{"problem":"Integrate x^2 from 0 to 3"}' | grep -q '"answer_text":"9"'
          # hardening: security headers, docs disabled, oversized bodies rejected
          curl -sI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -sI http://localhost:8000/api/health | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = 404
          python3 -c "print('{\"problem\":\"' + 'x'*40000 + '\"}')" > /tmp/big.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/solve -H 'Content-Type: application/json' --data-binary @/tmp/big.json)" = 413
      - if: always()
        run: docker compose down
