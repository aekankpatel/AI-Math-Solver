[project]
name = "mathforge-ai"
version = "0.1.0"
description = "Solver–Verifier–Tutor math reasoning backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731"]  # long LaTeX strings are clearer unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
