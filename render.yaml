# Render Blueprint: the Mathora API as a free Docker web service.
# Render dashboard -> New -> Blueprint -> select this repository. You are asked for the two secrets below.
services:
  - type: web
    name: mathora-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./deploy/render/Dockerfile
    healthCheckPath: /api/health
    # redeploy on pushes to main that change the backend, once GitHub checks (CI) have passed
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/app/**
        - backend/requirements.txt
        - deploy/render/**
    envVars:
      - key: GROQ_API_KEY # secret: entered in the Render dashboard, never committed
        sync: false
      - key: CORS_ORIGINS # your Vercel production URL, e.g. https://mathora.vercel.app
        sync: false
